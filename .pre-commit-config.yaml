default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: conventional-commit
        name: commit message follows Conventional Commits
        language: system
        entry: python scripts/check_commit_message.py
        stages: [commit-msg]
      - id: no-local-paths
        name: no paths from a developer's machine
        language: pygrep
        entry: '[A-Za-z]:[\\/]+(Users|Code)[\\/]|/home/[a-z]+/|/Users/[a-z]+/'
        exclude: ^(data/|backend/uv\.lock$|\.pre-commit-config\.yaml$)
        types: [text]
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run --directory backend ruff check .
        pass_filenames: false
        files: ^backend/
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --directory backend ruff format --check .
        pass_filenames: false
        files: ^backend/
      - id: import-linter
        name: layer boundaries
        language: system
        entry: uv run --directory backend lint-imports
        pass_filenames: false
        files: ^backend/
      - id: mypy
        name: mypy
        language: system
        entry: uv run --directory backend mypy
        pass_filenames: false
        files: ^backend/
