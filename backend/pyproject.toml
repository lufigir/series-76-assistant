[project]
name = "series-76-backend"
version = "0.1.0"
description = "FastAPI and LangChain backend of the Series 76 technical assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "langchain>=1.2",
    "langchain-google-genai>=4.0",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.10",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.3",
    "mypy>=1.17",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "testcontainers[postgres]>=4.10",
]
ingest = [
    "pymupdf>=1.26",
    "python-dotenv>=1.1",
]

[tool.uv]
default-groups = ["dev", "ingest"]
exclude-newer = "7 days"
no-build = true
package = false

[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["%(here)s"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "DTZ", "E", "ERA", "F", "FIX", "I", "N", "PTH", "RUF", "S", "SIM", "T20", "TD", "UP", "W"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"ingest.py" = ["T20"]
"seed.py" = ["S105", "S106", "T20"]
"tests/**" = ["S101", "S105", "S106"]
"tests/evals/run.py" = ["S101", "S105", "S106", "T20"]

[tool.mypy]
files = ["src", "seed.py"]
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "auto"
filterwarnings = ["error"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Application layers point downwards"
type = "layers"
layers = ["src.main", "src.conversations | src.transcriptions", "src.auth | src.agent", "src.actuators", "src.core"]

[[tool.importlinter.contracts]]
name = "Inside auth: router > dependencies > service > repository"
type = "layers"
layers = [
    "src.auth.router",
    "src.auth.dependencies",
    "src.auth.service",
    "src.auth.repository",
    "src.auth.models | src.auth.schemas | src.auth.security",
]

[[tool.importlinter.contracts]]
name = "Inside actuators: service > repository, and matching stays pure"
type = "layers"
layers = [
    "src.actuators.provider",
    "src.actuators.service",
    "src.actuators.repository | src.actuators.matching",
    "src.actuators.models | src.actuators.notes | src.actuators.part_numbers | src.actuators.schemas",
    "src.actuators.enums",
]

[[tool.importlinter.contracts]]
name = "Inside conversations: router > dependencies > service > repository"
type = "layers"
layers = [
    "src.conversations.router",
    "src.conversations.dependencies",
    "src.conversations.service",
    "src.conversations.repository",
    "src.conversations.models",
    "src.conversations.schemas",
    "src.conversations.enums",
]

[[tool.importlinter.contracts]]
name = "Inside transcriptions: router > dependencies > service, and sniffing stays pure"
type = "layers"
layers = [
    "src.transcriptions.router",
    "src.transcriptions.dependencies",
    "src.transcriptions.service",
    "src.transcriptions.audio | src.transcriptions.schemas",
]

[[tool.importlinter.contracts]]
name = "Inside agent: assistant > middleware > tools, and the rules stay pure"
type = "layers"
layers = [
    "src.agent.assistant",
    "src.agent.middleware",
    "src.agent.tools | src.agent.prompts",
    "src.agent.state",
    "src.agent.follow_ups",
    "src.agent.fallback | src.agent.outcome",
    "src.agent.number_validator | src.agent.plain_text | src.agent.schemas",
]

[[tool.importlinter.contracts]]
name = "Only repositories, models and dependency wiring touch the ORM"
type = "forbidden"
source_modules = [
    "src.actuators.matching",
    "src.actuators.notes",
    "src.actuators.part_numbers",
    "src.actuators.schemas",
    "src.actuators.service",
    "src.agent",
    "src.auth.router",
    "src.auth.schemas",
    "src.auth.security",
    "src.auth.service",
    "src.core.config",
    "src.core.errors",
    "src.core.llm",
    "src.core.logging",
    "src.conversations.router",
    "src.conversations.schemas",
    "src.conversations.service",
    "src.main",
    "src.transcriptions",
]
forbidden_modules = ["sqlalchemy"]
allow_indirect_imports = true
